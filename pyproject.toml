[project]
name = "app"
version = "0.1.0"
description = "Local Instagram & Markdown knowledge base with semantic search and AI-powered enrichment."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "leonardodg", email = "leonardodg@msn.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "pika>=1.3.0",
    "alembic>=1.13.0",
    "faster-whisper>=1.0.0",
    "instagrapi>=3.0.20",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    # Pinned, not >=: faster-whisper 1.2.1's decode_audio() calls
    # av.open(..., metadata_errors="ignore") -- a kwarg PyAV removed in
    # 19.0.0. av>=12 lets uv resolve 19.x, which breaks every video
    # transcription with a silent-looking TypeError (caught by the
    # worker's try/except, so it just looked like "every video fails"
    # with no hint why). faster-whisper has not released a fix (latest
    # is still 1.2.1, declares av>=11 with no upper bound -- same trap
    # we just fell into). Verified 2026-10-07 on Python 3.14 with a real
    # decode_audio(): 15.1.0/17.1.0/18.0.0/18.1.0 pass; 19.0.0/19.0.1
    # raise TypeError. 18.1.0 = newest release that works. Found live
    # against the real ig-worker, 2026-10-07 -- see docs/HANDOFF.md.
    "av==18.1.0",
    "yt-dlp>=2024.1.0",
    "fastmcp>=4.0.11",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]

[tool.setuptools.package-find]
where = "src"

[tool.uv]
default-groups = ["dev"]
preview = true
# instagrapi>=3.0.20 pins pydantic==2.12.5 on sys_platform=='android'
# (their marker), which conflicts with this project's pydantic>=2.13.4.
# This is a Linux server project -- exclude Android from resolution
# (uv's own hint for this exact failure).
environments = ["sys_platform != 'android'"]

# =========================
# LINTING & FORMATTING (Ruff)
# =========================

[tool.ruff]
# Define a compatibilidade mínima com Python 3.14
target-version = "py314"
line-length = 88
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
# Melhores práticas: Ativa regras padrões, Flake8, Isort (organização de imports) e Pylint
select = ["E", "F", "I", "W", "PL"]
ignore = [
    "PLR0913", # Permite mais de 5 argumentos em funções (comum em FastAPI)
]

[tool.ruff.lint.isort]
# Garante que os imports do seu app fiquem separados de bibliotecas externas
known-first-party = ["app", "src"]

[tool.ruff.format]
# Padrão Black/PEP 8 para formatação automática de código
quote-style = "double"
indent-style = "space"


[tool.pyright]
pythonVersion = "3.14"

[tool.uv.audit]
malware-check = true

[tool.bandit]
exclude_dirs = [".venv", "tests", "features"]
targets = ["src"]
# skips = ["B101"] # Example: skip assert statement warnings
