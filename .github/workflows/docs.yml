name: Docs

# Publishes the MkDocs site to GitHub Pages. Only the built static output
# (site/ -- HTML, CSS, JS and assets) is uploaded; no markdown source, no
# Python, no config files reach the published site.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # --only-group docs installs just the MkDocs packages without the
      # project or its runtime dependencies.
      - name: Install docs dependencies
        run: uv sync --only-group docs

      # --strict turns a broken internal link into a failed build. A dead link
      # should stop the deploy, not ship.
      - name: Build (strict)
        run: uv run mkdocs build --strict

      - name: Assert the artifact carries no source files
        run: |
          set -euo pipefail
          leaked=$(find site -type f \
            \( -name '*.md' -o -name '*.py' -o -name '*.yml' \
               -o -name '*.yaml' -o -name '*.toml' -o -name '*.sh' \) | head -20)
          if [ -n "$leaked" ]; then
            echo "::error::source files found in the Pages artifact:"
            echo "$leaked"
            exit 1
          fi
          echo "✅ site/ is static output only ($(find site -type f | wc -l) files)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
